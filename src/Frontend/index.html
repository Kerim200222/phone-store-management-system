<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone Store Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app-layout">
    <header class="app-header">
      <div class="logo">📱 PhoneStore Pro</div>
      <div class="system-status">
        <span class="status-indicator online"></span>
        <span id="backend-status">Sistem Hazır (Faz 1)</span>
      </div>
    </header>

    <main class="app-body">
      <div class="welcome-card">
        <h1>Telefon Mağazası & Teknik Servis Yönetimi</h1>
        <p>Antigravity UI + C# .NET 8 Backend + C++ Native Hardware Bridge</p>
        <div class="badge-row">
          <span class="badge">IMEI Engine</span>
          <span class="badge">POS Kasa</span>
          <span class="badge">Teknik Servis</span>
          <span class="badge">Scrumban</span>
        </div>
      </div>
    </main>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
